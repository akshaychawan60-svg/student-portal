<!DOCTYPE html>
<html>
<head>
    <title>Admin Portal</title>
    <style>
        :root{
            --sidebar-bg:#0b0e14;
            --sidebar-hover:#1a1f26;
            --primary:#2563eb;
            --text:#ffffff;
            --muted:#94a3b8;
            --page:#f0f4f8;
        }
        *{box-sizing:border-box}
        body{margin:0;font-family:Segoe UI,Arial;background:var(--page)}

        .topbar{
            height:56px;
            background:#fff;
            border-bottom:1px solid #e2e8f0;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 16px;
        }

        .brand{
            font-size:20px;
            font-weight:700;
            letter-spacing:.5px;
        }

        .profile img{
            width:36px;
            height:36px;
            border-radius:50%;
        }

        .menu-btn{
            width:36px;
            height:36px;
            background:#2563eb;
            color:white;
            border-radius:8px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            cursor:pointer;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }
        .menu-btn:hover{background:#1e4fd8}

        .sidebar{
            position:fixed;
            left:-260px;
            top:56px;
            width:260px;
            height:calc(100vh - 56px);
            background:var(--sidebar-bg);
            color:var(--text);
            transition:.3s;
            padding-top:10px;
        }
        .sidebar.open{left:0}

        .sidebar a{
            display:block;
            padding:12px 16px;
            color:var(--muted);
            text-decoration:none;
        }
        .sidebar a:hover{
            background:var(--sidebar-hover);
            color:#fff;
        }

        .content{
            margin-left:0;
            padding:24px;
            transition:.3s;
            width:100%;
        }
        .content.shift{margin-left:260px}

        .hero{
            text-align:center;
            margin-top:30px;
        }
        .hero h1{
            font-size:32px;
            font-weight:800;
            color:#1e293b;
            margin-bottom:6px;
        }
        .hero p{
            color:#64748b;
            margin-bottom:18px;
        }
        .hero img{
            max-width:700px;
            width:90%;
            border-radius:14px;
            box-shadow:0 20px 40px rgba(0,0,0,0.15);
        }

        iframe{
            width:100%;
            height:80vh;
            border:none;
            background:#fff;
            border-radius:8px;
        }

        .footer{
            margin-top:40px;
            text-align:center;
            color:#94a3b8;
            font-size:13px;
        }
        html, body {
    width: 100%;
    margin: 0;
    overflow-x: hidden;   /* removes horizontal scrollbar */
}

    </style>
</head>
<body>

<div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
        <div class="brand">Student Portal</div>
    </div>
    <div class="profile">
        <img src="/static/images/profile_ui.png">
    </div>
</div>

<div class="sidebar" id="sidebar">
    <a href="#" onclick="openService('/manage_users')">Manage Students</a>
    <a href="#" onclick="openService('/links/apps')">Manage Apps</a>
    <a href="#" onclick="openService('/links/govt')">Manage Government Schemes</a>
    <a href="#" onclick="openService('/notes')">Shared Notes</a>
    <a href="#" onclick="openService('/links/skills')">Manage Skill Links</a>
    <a href="#" onclick="openService('/skills/videos')">Manage Skill Videos</a>
    <a href="#" onclick="openService('/skills/materials')">Manage Skill Notes & Books</a>
    <a href="/logout">Logout</a>
</div>


<div class="content" id="content">
    <div class="hero" id="hero">
        <h1>Welcome, Admin</h1>
        <p>Open the menu to manage services</p>
        <img src="/static/images/study_big.png">
    </div>

    <div id="frameBox" style="display:none">
        <iframe id="frame"></iframe>
    </div>

    <div class="footer">
        © 2026 Student Portal | Learn • Organize • Grow
    </div>
</div>

<script>
function toggleMenu(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('content').classList.toggle('shift');
}
function openService(url){
    document.getElementById('hero').style.display='none';
    document.getElementById('frameBox').style.display='block';
    document.getElementById('frame').src = url;
}
</script>

</body>
</html>

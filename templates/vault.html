<!DOCTYPE html>
<html>
<head>
    <title>My Secret Vault</title>
    <style>
        body{
            margin:0;
            font-family:"Segoe UI", Arial;
            background:linear-gradient(135deg,#eef2ff,#f8fafc);
            padding:20px;
        }

        .vault-card{
            max-width:900px;
            margin:auto;
            background:#ffffff;
            border-radius:20px;
            box-shadow:0 25px 50px rgba(0,0,0,0.15);
            padding:26px 30px 30px;
            animation:fade .5s ease;
        }

        @keyframes fade{
            from{opacity:0; transform:translateY(20px)}
            to{opacity:1; transform:translateY(0)}
        }

        h2{
            margin:0 0 18px;
            color:#1e293b;
            font-size:26px;
            font-weight:800;
            display:flex;
            align-items:center;
            gap:8px;
        }

        h2::before{
            content:"🔐";
            font-size:24px;
        }

        .form-grid{
            display:grid;
            grid-template-columns:1fr 1fr auto;
            gap:12px;
            margin-bottom:18px;
        }

        .form-grid input{
            padding:10px 12px;
            border-radius:12px;
            border:1px solid #e2e8f0;
            font-size:13px;
            outline:none;
        }

        .form-grid button{
            background:#2563eb;
            color:white;
            border:none;
            border-radius:12px;
            padding:10px 16px;
            cursor:pointer;
            box-shadow:0 8px 18px rgba(37,99,235,.35);
            transition:.2s;
        }

        .form-grid button:hover{
            background:#1e4fd8;
            transform:translateY(-1px);
        }

        .table-wrap{
            margin-top:10px;
            border-radius:14px;
            overflow:hidden;
            border:1px solid #e2e8f0;
        }

        table{
            width:100%;
            border-collapse:collapse;
            font-size:13px;
        }

        thead{
            background:#f1f5f9;
        }

        th,td{
            padding:12px 14px;
            text-align:left;
        }

        th{
            color:#1e293b;
            font-weight:700;
            border-bottom:1px solid #e2e8f0;
        }

        td{
            color:#334155;
            border-bottom:1px solid #f1f5f9;
        }

        tr:hover td{
            background:#f8fafc;
        }

        .file-link{
            color:#2563eb;
            text-decoration:none;
            font-weight:600;
        }

        .file-link:hover{
            text-decoration:underline;
        }

        a[href="/vault_logout"]{
    display:inline-block;
    margin-top:18px;
    padding:10px 20px;
    background:#ef4444;
    color:#fff;
    border-radius:10px;
    text-decoration:none;
    font-weight:700;
    box-shadow:0 8px 18px rgba(239,68,68,.35);
    transition:.2s;
}

a[href="/vault_logout"]:hover{
    background:#dc2626;
    transform:translateY(-1px);
}



        @media(max-width:700px){
            .form-grid{
                grid-template-columns:1fr;
            }
        }
        .del{
    color:#dc2626;
    text-decoration:none;
    font-weight:600;
}
.del:hover{
    text-decoration:underline;
}


    </style>
</head>
<body>

<div class="vault-card">
    <h2>My Secret Vault</h2>

    <form method="post" enctype="multipart/form-data" class="form-grid">
        <input type="text" name="title" placeholder="Document Title" required>
        <input type="file" name="file" required>
        <button>Upload</button>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>File</th>
                </tr>
            </thead>
            <tbody>
            {% for v in data %}
                <tr>
                    <td>{{ v[2] }}</td>
                    <td>
                        <a class="file-link" href="/static/uploads/secret_docs/{{ v[3] }}" target="_blank">
                            View / Download
                        </a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>

    <a href="/vault_logout" target="_top">Exit Vault</a>

</div>
<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>File</th>
            </tr>
        </thead>
        <tbody>
        {% for v in data %}
            <tr>
                <td>{{ v[2] }}</td>
                <td>
                    <a class="file-link" href="/static/uploads/secret_docs/{{ v[3] }}" target="_blank">
                        View / Download
                    </a>
                    &nbsp; | &nbsp;
                    <a class="del" href="/delete_vault/{{ v[0] }}"
                       onclick="return confirm('Delete this secret file?')">
                        Delete
                    </a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>


</body>
</html>

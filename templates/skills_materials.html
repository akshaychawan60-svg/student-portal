<!DOCTYPE html>
<html>
<head>
    <title>Skill Notes & Books</title>
    <style>
        html, body{
            margin:0;
            font-family:"Segoe UI", Arial;
            background:#f0f4f8;
            overflow-x:hidden;
        }

        .card{
        max-width:1100px;
        margin:30px auto 30px 80px;  /* move more to the right */
        background:#ffffff;
        border-radius:18px;
        box-shadow:0 20px 40px rgba(0,0,0,0.12);
        padding:26px;
     }


        h2{
            margin-top:0;
            font-size:26px;
            color:#1e293b;
        }

        .upload-bar{
            position:sticky;
            top:0;
            background:#ffffff;
            z-index:50;
            padding-bottom:14px;
            margin-bottom:12px;
        }

        .form-grid{
            display:grid;
            grid-template-columns: 1.6fr 1.6fr 140px;
            gap:14px;
            align-items:center;
            max-width:100%;
        }

        .form-grid input[type="text"],
        .form-grid input[type="file"]{
            padding:10px 12px;
            border-radius:10px;
            border:1px solid #e2e8f0;
            outline:none;
        }

        .form-grid button{
            padding:10px 18px;
            border-radius:10px;
            border:none;
            background:#2563eb;
            color:white;
            cursor:pointer;
            font-weight:600;
        }

        .form-grid button:hover{
            background:#1e4fd8;
        }

        .search-box{
            margin:10px 0 14px;
            width:260px;
            padding:9px 12px;
            border-radius:10px;
            border:1px solid #e2e8f0;
        }

        .file-grid{
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap:16px;
        }

        .file-card{
            background:#f8fafc;
            border:1px solid #e2e8f0;
            border-radius:14px;
            padding:14px;
            box-shadow:0 6px 14px rgba(0,0,0,0.06);
        }

        .file-card h4{
            margin:0 0 6px;
            font-size:15px;
            color:#1e293b;
        }

        .file-card .open{
            display:inline-block;
            margin-top:8px;
            padding:6px 12px;
            background:#2563eb;
            color:#fff;
            border-radius:8px;
            text-decoration:none;
            font-size:12px;
        }

        .file-card .del{
            display:inline-block;
            margin-left:8px;
            color:#ef4444;
            font-size:12px;
            text-decoration:none;
        }

        .back{
            display:inline-block;
            margin-top:16px;
            color:#2563eb;
            text-decoration:none;
            font-weight:600;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Skill Notes & Books</h2>

    <div class="upload-bar">
        <form method="post" enctype="multipart/form-data" class="form-grid">
            <input type="text" name="title" placeholder="Title" required>
            <input type="file" name="file" required>
            <button>Upload</button>
        </form>
    </div>

    <input type="text" id="searchBox" class="search-box" placeholder="Search notes & books...">

    <div class="file-grid">
    {% for m in data %}
        <div class="file-card">
            <h4>{{ m[2] }}</h4>

            <a class="open" href="/static/uploads/skills_materials/{{ m[4] }}" target="_blank">
                Open
            </a>

            {% if session['is_admin'] == 1 %}
                <a class="del" href="/delete_skill/{{ m[0] }}/material"
                   onclick="return confirm('Delete this file?')">Delete</a>
            {% endif %}
        </div>
    {% endfor %}
    </div>

    <a href="/dashboard" target="_top">Back to Dashboard</a>

</div>

<script>
document.getElementById("searchBox").addEventListener("keyup", function () {
    let val = this.value.toLowerCase();
    document.querySelectorAll(".file-card").forEach(function (card) {
        card.style.display = card.innerText.toLowerCase().includes(val) ? "" : "none";
    });
});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Manage Students</title>
    <style>
        html, body{
            margin:0;
            font-family:"Segoe UI", Arial;
            background:#f0f4f8;
        }

        .card{
            max-width:1000px;
            width:100%;
            margin:30px auto 30px 50px;
            background:#ffffff;
            border-radius:20px;
            box-shadow:0 25px 50px rgba(0,0,0,0.15);
            padding:26px 28px 30px;
            animation:fade .4s ease;
        }

        @keyframes fade{
            from{opacity:0; transform:translateY(16px)}
            to{opacity:1; transform:translateY(0)}
        }

        h2{
            margin-top:0;
            font-size:28px;
            color:#1e293b;
            font-weight:800;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:12px;
        }

        th, td{
            padding:12px 14px;
            border-bottom:1px solid #e2e8f0;
            text-align:left;
            font-size:14px;
        }

        th{
            background:#f8fafc;
            color:#475569;
            font-weight:700;
        }

        tr:hover{
            background:#f9fbff;
        }

        .del{
            color:#ef4444;
            text-decoration:none;
            font-weight:700;
        }

        .del:hover{
            text-decoration:underline;
        }

        .back{
            display:inline-block;
            margin-top:18px;
            color:#2563eb;
            text-decoration:none;
            font-weight:700;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Manage Students</h2>

    <table>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Email</th>
            <th>Action</th>
        </tr>

        {% for u in users %}
        <tr>
            <td>{{ u[0] }}</td>
            <td>{{ u[1] }}</td>
            <td>{{ u[2] }}</td>
            <td>
                <a class="del" href="/delete_user/{{ u[0] }}"
                   onclick="return confirm('Delete this student?')">
                   Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <a class="back" href="/dashboard" target="_top">← Back to Dashboard</a>
</div>

</body>
</html>

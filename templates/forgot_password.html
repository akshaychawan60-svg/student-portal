<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <style>
        body{
            margin:0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #141E30, #243B55);
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .forgot-box{
            width:380px;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 20px 40px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease;
        }

        .forgot-box h2{
            margin:0;
            font-size:26px;
            font-weight:bold;
            color:#222;
        }

        .forgot-box p{
            margin-top:8px;
            color:#666;
            font-size:14px;
            line-height:1.5;
        }

        .forgot-box input{
            width:100%;
            padding:12px;
            margin:12px 0;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            font-size:14px;
        }

        .forgot-box input:focus{
            border-color:#2575fc;
            box-shadow:0 0 5px rgba(37,117,252,0.5);
        }

        .forgot-box button{
            width:100%;
            padding:12px;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color:white;
            border:none;
            border-radius:8px;
            font-size:15px;
            cursor:pointer;
            margin-top:5px;
        }

        .forgot-box button:hover{
            opacity:0.9;
        }

        .back{
            margin-top:12px;
            text-align:center;
            font-size:13px;
        }

        .back a{
            color:#2575fc;
            text-decoration:none;
        }

        .back a:hover{
            text-decoration:underline;
        }

        @keyframes fadeIn{
            from{opacity:0; transform:translateY(20px);}
            to{opacity:1; transform:translateY(0);}
        }
    </style>
</head>
<body>

<div class="forgot-box">
    <h2>Forgot your password?</h2>
    <p>No worries. Enter your Roll Number and Email below and your password will be reset here.</p>

    <form method="post">
        <input type="text" name="rollno" placeholder="Roll Number" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="newpass" placeholder="New Password" required>
        <button>Reset Password</button>
    </form>

    <div class="back">
        <a href="/">Back to Login</a>
    </div>
</div>

</body>
</html>

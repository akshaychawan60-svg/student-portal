<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <style>
        body{
            margin:0;
            font-family:"Segoe UI", Arial;
            background:#f0f4f8;
        }

        .profile-card{
            max-width:720px;
            margin:30px auto;
            background:#ffffff;
            border-radius:18px;
            box-shadow:0 20px 40px rgba(0,0,0,0.1);
            overflow:hidden;
        }

        .header{
            background:linear-gradient(135deg,#2563eb,#1e40af);
            padding:30px;
            color:white;
            display:flex;
            align-items:center;
            gap:20px;
        }

        .header img{
            width:90px;
            height:90px;
            border-radius:50%;
            border:4px solid white;
            object-fit:cover;
            background:#fff;
        }

        .header h2{
            margin:0;
            font-size:26px;
            font-weight:800;
        }

        .header p{
            margin:4px 0 0;
            opacity:0.9;
            font-size:14px;
        }

        .body{
            padding:24px 30px;
        }

        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px;
        }

        .field{
            background:#f8fafc;
            padding:14px 16px;
            border-radius:12px;
            border:1px solid #e2e8f0;
        }

        .field span{
            display:block;
            font-size:12px;
            color:#64748b;
            margin-bottom:4px;
        }

        .field b{
            font-size:14px;
            color:#1e293b;
        }

        .actions{
            margin-top:22px;
            text-align:center;
        }

        .actions a{
            display:inline-block;
            padding:10px 18px;
            border-radius:10px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            font-size:14px;
            box-shadow:0 6px 14px rgba(37,99,235,0.35);
            transition:.2s;
        }

        .actions a:hover{
            background:#1e4fd8;
            transform:translateY(-1px);
        }
    </style>
</head>
<body>

<div class="profile-card">
    <div class="header">
        <img src="/static/uploads/profile_photos/{{ user[8] }}">
        <div>
            <h2>{{ user[1] }}</h2>
            <p>Roll No: {{ user[0] }}</p>
        </div>
    </div>

    <div class="body">
        <div class="grid">
            <div class="field">
                <span>Qualification</span>
                <b>{{ user[2] }}</b>
            </div>
            <div class="field">
                <span>Year</span>
                <b>{{ user[3] }}</b>
            </div>
            <div class="field">
                <span>Branch</span>
                <b>{{ user[4] }}</b>
            </div>
            <div class="field">
                <span>Semester</span>
                <b>{{ user[5] }}</b>
            </div>
            <div class="field">
                <span>College</span>
                <b>{{ user[6] }}</b>
            </div>
            <div class="field">
                <span>Email</span>
                <b>{{ user[7] }}</b>
            </div>
        </div>

        <div class="actions">
           <a href="/dashboard" target="_top">Back to Dashboard</a>

        </div>
    </div>
</div>

</body>
</html>
